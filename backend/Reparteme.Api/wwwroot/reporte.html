<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte - Reparteme</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-blue-600 text-white p-4">
        <div class="flex justify-between items-center">
            <h1 class="text-2xl font-bold">Reparteme</h1>
            <a href="index.html" class="hover:underline">Inicio</a>
        </div>
    </nav>

    <main class="container mx-auto p-4">
        <h2 class="text-xl font-bold mb-4">Reporte de Consumo</h2>

        <table class="w-full bg-white rounded shadow">
            <thead class="bg-gray-200">
                <tr>
                    <th class="p-3 text-left">Producto</th>
                    <th class="p-3 text-left">Entradas</th>
                    <th class="p-3 text-left">Salidas</th>
                    <th class="p-3 text-left">Stock Actual</th>
                </tr>
            </thead>
            <tbody id="tablaReporte"></tbody>
        </table>
    </main>

    <script>
        async function cargar() {
            const res = await fetch('/api/reporte/consumo');
            const datos = await res.json();
            const tabla = document.getElementById('tablaReporte');
            tabla.innerHTML = datos.map(r => `
                <tr class="border-t">
                    <td class="p-3">${r.nombre}</td>
                    <td class="p-3 text-green-600">${r.entradas}</td>
                    <td class="p-3 text-red-600">${r.salidas}</td>
                    <td class="p-3 font-bold">${r.cantidadActual}</td>
                </tr>
            `).join('');
        }

        cargar();
    </script>
</body>
</html>
