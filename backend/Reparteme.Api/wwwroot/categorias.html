<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorias - Reparteme</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-blue-600 text-white p-4">
        <div class="flex justify-between items-center">
            <h1 class="text-2xl font-bold">Reparteme</h1>
            <a href="index.html" class="hover:underline">Inicio</a>
        </div>
    </nav>

    <main class="container mx-auto p-4">
        <h2 class="text-xl font-bold mb-4">Categorias</h2>

        <form id="formCategoria" class="bg-white p-4 rounded shadow mb-6">
            <input type="hidden" id="categoriaId">
            <div class="mb-3">
                <label class="block text-sm font-medium mb-1">Nombre</label>
                <input type="text" id="nombre" class="w-full border rounded p-2" required>
            </div>
            <div class="mb-3">
                <label class="block text-sm font-medium mb-1">Descripcion</label>
                <input type="text" id="descripcion" class="w-full border rounded p-2">
            </div>
            <div class="flex gap-2">
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Guardar</button>
                <button type="button" id="btnCancelar" class="bg-gray-400 text-white px-4 py-2 rounded hidden">Cancelar</button>
            </div>
        </form>

        <table class="w-full bg-white rounded shadow">
            <thead class="bg-gray-200">
                <tr>
                    <th class="p-3 text-left">Nombre</th>
                    <th class="p-3 text-left">Descripcion</th>
                    <th class="p-3 text-left">Estado</th>
                    <th class="p-3 text-left">Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaCategorias"></tbody>
        </table>
    </main>

    <script>
        const API = '/api/categorias';

        async function cargar() {
            const res = await fetch(API);
            const datos = await res.json();
            const tabla = document.getElementById('tablaCategorias');
            tabla.innerHTML = datos.map(c => `
                <tr class="border-t">
                    <td class="p-3">${c.nombre}</td>
                    <td class="p-3">${c.descripcion}</td>
                    <td class="p-3">${c.activa ? 'Activa' : 'Inactiva'}</td>
                    <td class="p-3">
                        <button onclick="editar('${c.id}')" class="text-blue-600 mr-2">Editar</button>
                        <button onclick="eliminar('${c.id}')" class="text-red-600">Eliminar</button>
                    </td>
                </tr>
            `).join('');
        }

        document.getElementById('formCategoria').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('categoriaId').value;
            const datos = {
                nombre: document.getElementById('nombre').value,
                descripcion: document.getElementById('descripcion').value
            };

            if (id) {
                datos.activa = true;
                await fetch(`${API}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });
            } else {
                await fetch(API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });
            }
            limpiar();
            cargar();
        });

        async function editar(id) {
            const res = await fetch(`${API}/${id}`);
            const c = await res.json();
            document.getElementById('categoriaId').value = c.id;
            document.getElementById('nombre').value = c.nombre;
            document.getElementById('descripcion').value = c.descripcion;
            document.getElementById('btnCancelar').classList.remove('hidden');
        }

        async function eliminar(id) {
            if (confirm('Eliminar esta categoria?')) {
                await fetch(`${API}/${id}`, { method: 'DELETE' });
                cargar();
            }
        }

        function limpiar() {
            document.getElementById('categoriaId').value = '';
            document.getElementById('nombre').value = '';
            document.getElementById('descripcion').value = '';
            document.getElementById('btnCancelar').classList.add('hidden');
        }

        document.getElementById('btnCancelar').addEventListener('click', limpiar);

        cargar();
    </script>
</body>
</html>
