<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorias - Reparteme</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="navbar">
        <a href="index.html" class="navbar-logo">
            <img src="img/logo.png" alt="Reparteme">
        </a>
        <div class="navbar-links">
            <a href="categorias.html" class="activo">Categorias</a>
            <a href="productos.html">Productos</a>
            <a href="movimientos.html">Movimientos</a>
            <a href="reporte.html">Reporte</a>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-6">
        <h2 class="seccion-titulo">Categorias</h2>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div>
                <div class="card">
                    <h3 class="card-titulo" id="formTitulo">Nueva Categoria</h3>
                    <form id="formCategoria">
                        <input type="hidden" id="categoriaId">
                        <div class="campo">
                            <label class="label">Nombre</label>
                            <input type="text" id="nombre" class="input" required>
                        </div>
                        <div class="campo">
                            <label class="label">Descripcion</label>
                            <input type="text" id="descripcion" class="input">
                        </div>
                        <div class="flex gap-2">
                            <button type="submit" class="btn btn-primario">Guardar</button>
                            <button type="button" id="btnCancelar" class="btn btn-gris hidden">Cancelar</button>
                        </div>
                    </form>
                </div>

                <div class="card">
                    <h3 class="card-titulo">Buscar</h3>
                    <div class="flex gap-2">
                        <input type="text" id="buscar" placeholder="Nombre..." class="input">
                        <button onclick="buscar()" class="btn btn-verde">Buscar</button>
                    </div>
                    <button onclick="cargar()" class="btn-texto-azul mt-2" style="font-size:0.85rem;">Ver todas</button>
                </div>
            </div>

            <div class="md:col-span-2">
                <div class="card">
                    <h3 class="card-titulo">Listado</h3>
                    <div class="tabla-container">
                        <table class="tabla">
                            <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th>Descripcion</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tablaCategorias"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="modal" class="modal-overlay hidden">
        <div class="modal-contenido">
            <p id="modalMensaje"></p>
            <div class="modal-botones">
                <button id="modalConfirmar" class="btn btn-primario">Confirmar</button>
                <button id="modalCancelar" class="btn btn-gris">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="js/categorias.js"></script>
</body>
</html>
