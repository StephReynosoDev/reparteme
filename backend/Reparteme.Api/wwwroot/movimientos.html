<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movimientos - Reparteme</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="navbar">
        <a href="index.html" class="navbar-logo">
            <img src="img/logo.png" alt="Reparteme">
        </a>
        <div class="navbar-links">
            <a href="categorias.html">Categorias</a>
            <a href="productos.html">Productos</a>
            <a href="movimientos.html" class="activo">Movimientos</a>
            <a href="reporte.html">Reporte</a>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-6">
        <h2 class="seccion-titulo">Movimientos</h2>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div>
                <div class="card">
                    <h3 class="card-titulo">Registrar Movimiento</h3>
                    <form id="formMovimiento">
                        <div class="campo">
                            <label class="label">Producto</label>
                            <select id="productoId" class="input" required></select>
                        </div>
                        <div class="campo">
                            <label class="label">Cantidad</label>
                            <input type="number" id="cantidad" class="input" min="1" max="999999" required>
                        </div>
                        <div class="campo">
                            <label class="label">Tipo</label>
                            <select id="tipo" class="input">
                                <option value="0">Entrada</option>
                                <option value="1">Salida</option>
                            </select>
                        </div>
                        <div class="campo">
                            <label class="label">Motivo</label>
                            <input type="text" id="motivo" class="input">
                        </div>
                        <button type="submit" class="btn btn-primario">Registrar</button>
                    </form>
                </div>
            </div>

            <div class="md:col-span-2">
                <div class="card">
                    <h3 class="card-titulo">Historial</h3>
                    <div class="tabla-container">
                        <table class="tabla">
                            <thead>
                                <tr>
                                    <th>Producto</th>
                                    <th>Tipo</th>
                                    <th>Cantidad</th>
                                    <th>Motivo</th>
                                    <th>Fecha</th>
                                </tr>
                            </thead>
                            <tbody id="tablaMovimientos"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/movimientos.js"></script>
</body>
</html>
